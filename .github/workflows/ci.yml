# Quality gate de integración continua.
#
# Se ejecuta en cada pull request y push sobre main.
# Para bloquear merges, estos checks deberán configurarse posteriormente
# como obligatorios en la protección de la rama main.

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring, bcmath
          coverage: none

      - name: Instalar dependencias PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar entorno Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      # Los feature tests actuales renderizan vistas con @vite.
      # Se necesita el manifest antes de ejecutar PHPUnit.
      - name: Node 20.19
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Instalar dependencias frontend
        run: npm ci

      - name: Construir assets para pruebas backend
        run: npm run build

      - name: Quality gate backend
        run: composer quality:backend

  frontend:
    name: Frontend Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20.19
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Quality gate frontend
        run: npm run quality
