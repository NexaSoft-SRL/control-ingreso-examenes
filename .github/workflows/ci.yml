# Quality gates de integración continua.
#
# Se ejecutan en cada pull request y push sobre main.
# Para bloquear merges, estos checks deben configurarse como obligatorios
# en la protección de la rama main.

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring, bcmath
          coverage: none

      - name: Instalar dependencias PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar entorno Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      # Los feature tests actuales renderizan vistas con @vite.
      # Se necesita el manifest antes de ejecutar PHPUnit.
      - name: Node 20.19
        uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Instalar dependencias frontend
        run: npm ci

      - name: Construir assets para pruebas backend
        run: npm run build

      - name: Quality gate backend
        run: composer quality:backend

  postgresql:
    name: PostgreSQL Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15.10-alpine
        env:
          POSTGRES_DB: control_ingreso_testing
          POSTGRES_USER: nexasoft
          POSTGRES_PASSWORD: nexasoft
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nexasoft -d control_ingreso_testing"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: PHP 8.2 con PostgreSQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, pgsql, mbstring, bcmath
          coverage: none

      - name: Instalar dependencias PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar entorno PostgreSQL de testing
        run: |
          cp .env.testing.example .env.testing
          php artisan key:generate --env=testing

      - name: Integración PostgreSQL 15.10
        run: composer test:postgresql

  frontend:
    name: Frontend Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 20.19
        uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Quality gate frontend
        run: npm run quality
